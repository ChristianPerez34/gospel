name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-macos:
    name: Build Apple Silicon DMG
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.94.1
          targets: aarch64-apple-darwin
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/sync-version.py --check --tag "$RELEASE_TAG"

      - name: Run code quality gates
        run: bun run check

      - name: Run frontend tests
        run: bun run test

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build and upload release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Gospel ${{ github.ref_name }}"
          releaseBody: |
            Alpha release for Apple Silicon Macs. Expect rough edges and report issues at https://github.com/ChristianPerez34/gospel/issues.

            See CHANGELOG.md for release notes and README.md for installation guidance.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: false
          tauriScript: bun tauri
          args: "--target aarch64-apple-darwin"
