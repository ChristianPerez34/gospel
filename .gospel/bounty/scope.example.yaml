# Copy to `.gospel/bounty/scope.yaml` and fill in for one authorized program.
# No scope.yaml means no network access for the Bug Bounty agent.

program: example-program

# Set true only after you have confirmed you are authorized to test this program.
authorized: false
authorization_note: "HackerOne/Bugcrowd program URL, engagement ID, or written authorization reference"

in_scope:
  - host: example.com
    paths: ["/api/*", "/app/*"]
    methods: [GET, HEAD, OPTIONS]
  - host: "*.example.com"
    paths: ["/*"]

out_of_scope:
  - host: example.com
    paths: ["/api/admin/*", "/billing/*"]

# Mutating methods are denied unless this is true.
allow_mutations: false

# Plain HTTP is denied unless this is true. Prefer HTTPS.
allow_http: false

# Private/localhost hosts are denied unless this is true. Use only for local labs.
allow_private_hosts: false

allowed_ports: [443]

rate_limit:
  requests_per_second: 1
  max_concurrent: 1

auth_profiles:
  user_a:
    type: bearer
    secret_ref: env:GOSPEL_BOUNTY_USER_A_TOKEN
  user_b:
    type: bearer
    secret_ref: env:GOSPEL_BOUNTY_USER_B_TOKEN
  # Keychain-backed secrets resolve from the app credential store instead of
  # an env var. Store once with the `store_bounty_secret` command, then:
  # session:
  #   type: cookie
  #   secret_ref: keychain:acme_session
  # Types: bearer | header (requires `header: X-Api-Key`) | cookie.

max_response_bytes: 1048576
timeout_seconds: 30

# When true, redirects are followed hop-by-hop; every hop re-passes scope,
# strips Authorization/Cookie on host change, capped at 5 hops.
follow_redirects: false
